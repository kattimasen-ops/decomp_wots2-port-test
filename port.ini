# M9 Pro — empfohlene Einstellungen für den RK3326
# Datei neben der wots2-Binary ablegen

# ── Auflösung ────────────────────────────────────────────────────
# 448 = 640x448 (nativ, PS2), 336 = 480x336, 224 = 320x224
video.height = 336
video.aspect = 1.3333
video.fps    = 30
video.vsync  = true
video.fullscreen = true

# ── Lighting ─────────────────────────────────────────────────────
lighting.shadows           = false
lighting.ao                = false
lighting.god_rays          = 0.0
lighting.dust              = 0.0
lighting.bloom             = 0.15
lighting.bloom_threshold   = 0.85
lighting.grade             = false
lighting.lanterns          = true
lighting.lantern_shadows   = false
lighting.bump              = 0.0
lighting.dof               = 0.0
lighting.weather           = 1

# ── Sichtweite (Fog skaliert) ────────────────────────────────────
fog.far_scale = 0.85
