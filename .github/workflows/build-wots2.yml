name: Build WOTS2 for RK3326

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README.md'

permissions:
  contents: write

jobs:
  build:
    name: Build host (aarch64) for M9 Pro / RK3326
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    env:
      SYSROOT_LIB: ${{ github.workspace }}/sysroot
      SDL2_INSTALL: ${{ github.workspace }}/sdl2-install
      DEBIAN_FRONTEND: noninteractive
      PKG_CONFIG_PATH: ${{ github.workspace }}/sysroot/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig
      JOBS: "4"
      CHDMAN_VERSION: "0.288.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Git Safe Directory
        run: git config --global --add safe.directory "*" || true

      - name: Repo-Struktur prüfen
        run: |
          echo "== Root =="; ls -la
          echo "== patches/ =="; ls -la patches/ || true
          echo "== scripts/ =="; ls -la scripts/ || true
          echo "== cmake/ =="; ls -la cmake/ || true

      - name: aarch64 Multiarch aktivieren
        run: |
          dpkg --add-architecture arm64
          cp /etc/apt/sources.list /etc/apt/sources.list.bak
          sed -i -E 's/^deb (\[[^]]*\] )?http/deb [arch=amd64] http/' /etc/apt/sources.list
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main universe' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main universe' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main universe' \
            > /etc/apt/sources.list.d/arm64.list
          apt-get update

      - name: CMake 3.28.3 installieren
        run: |
          apt-get install -y --no-install-recommends wget ca-certificates
          wget -q https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz
          tar -xzf cmake-3.28.3-linux-x86_64.tar.gz -C /opt
          ln -sf /opt/cmake-3.28.3-linux-x86_64/bin/cmake  /usr/local/bin/cmake
          ln -sf /opt/cmake-3.28.3-linux-x86_64/bin/ctest  /usr/local/bin/ctest
          ln -sf /opt/cmake-3.28.3-linux-x86_64/bin/cpack  /usr/local/bin/cpack
          rm cmake-3.28.3-linux-x86_64.tar.gz
          cmake --version

      - name: Native Build-Tools installieren
        run: |
          apt-get install -y --no-install-recommends \
            build-essential ninja-build git curl wget ca-certificates \
            pkg-config python3 python3-pip file patchelf \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            unzip p7zip-full libarchive-tools zstd xz-utils

      - name: aarch64 Dev-Pakete installieren
        run: |
          apt-get install -y --no-install-recommends \
            libdrm-dev:arm64 libgbm-dev:arm64 libegl-dev:arm64 \
            libgles2-mesa-dev:arm64 libasound2-dev:arm64 libudev-dev:arm64 \
            libarchive-dev:arm64 zlib1g-dev:arm64 libbz2-dev:arm64 \
            liblzma-dev:arm64 libzstd-dev:arm64 liblz4-dev:arm64 \
            libwayland-dev:arm64 libpulse-dev:arm64 libxkbcommon-dev:arm64

      - name: Cross-Sysroot einrichten
        run: bash scripts/ci-setup-sysroot.sh

      - name: SDL2 mit KMSDRM-Patches und ALSA bauen
        run: bash scripts/ci-build-sdl2.sh

      - name: Stubs (libmali, libdecor)
        run: bash scripts/ci-build-stubs.sh

      - name: CHD-Extractor (chdman arm64) herunterladen
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/chdman-arm64"
          cd "$GITHUB_WORKSPACE/chdman-arm64"
          wget -q -O chdman \
            "https://unpkg.com/@emmercm/chdman-linux-arm64@${CHDMAN_VERSION}/dist/chdman"
          wget -q -O LICENSE-chdman.txt \
            "https://unpkg.com/@emmercm/chdman-linux-arm64@${CHDMAN_VERSION}/LICENSE"
          chmod 755 chdman
          file chdman

      - name: Patches anwenden
        run: |
          set -euo pipefail

          find_script() {
            local name="$1"
            if [ -f "patches/$name" ]; then echo "patches/$name"
            elif [ -f "$name" ];      then echo "$name"
            else echo ""; fi
          }

          # ── Shader-Version auf GLES 3.2 ─────────────────────────────
          S=$(find_script wots2-gles.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/hal/gs.cpp; }

          # ── mediump-Qualifier ───────────────────────────────────────
          S=$(find_script wots2-gles-precision.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/hal/gs.cpp; } \
                    || echo "  (wots2-gles-precision.py nicht gefunden)"

          # ── NEON v3 (Culling-Fix) ───────────────────────────────────
          S=$(find_script wots2-neon.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/hal/gs.cpp; }

          # ── glTexStorage2D ──────────────────────────────────────────
          S=$(find_script wots2-gs-tex-storage.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/hal/gs.cpp; } \
                    || echo "  (wots2-gs-tex-storage.py nicht gefunden)"

          # ── glInvalidateFramebuffer ─────────────────────────────────
          S=$(find_script wots2-gs-invalidate.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/hal/gs.cpp; } \
                    || echo "  (wots2-gs-invalidate.py nicht gefunden)"

          # ── Shader-Cache v2 (link() ersetzt) ────────────────────────
          S=$(find_script wots2-gs-shader-cache.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/hal/gs.cpp; } \
                    || echo "  (wots2-gs-shader-cache.py nicht gefunden)"

          # ── 2D-Batching v3 ──────────────────────────────────────────
          S=$(find_script wots2-gs-batch-2d.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/hal/gs.cpp; } \
                    || echo "  (wots2-gs-batch-2d.py nicht gefunden)"

          # ── 3D-Merge (wots2-merge-3d-draws.py) ──────────────────────
          S=$(find_script wots2-merge-3d-draws.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/hal/gs.cpp; } \
                    || echo "  (wots2-merge-3d-draws.py nicht gefunden)"

          # ── Splash (v2, nur gs.cpp) ─────────────────────────────────
          S=$(find_script wots2-gs-splash.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/hal/gs.cpp; } \
                    || echo "  (wots2-gs-splash.py nicht gefunden)"

          # ── Diagnose init() + ES 3.2 ────────────────────────────────
          S=$(find_script wots2-gs-init-diag.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/hal/gs.cpp; } \
                    || echo "  (wots2-gs-init-diag.py nicht gefunden)"

          # ── Punktlichter von 16 auf 8 ───────────────────────────────
          S=$(find_script wots2-gs-combat.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/hal/gs.cpp; } \
                    || echo "  (wots2-gs-combat.py nicht gefunden)"

          # ── Perf-Trace (nur mit WOTS2_PERF_TRACE=1 aktiv) ───────────
          S=$(find_script wots2-gs-perf-trace.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/hal/gs.cpp; } \
                    || echo "  (wots2-gs-perf-trace.py nicht gefunden)"

          # ════════════════════════════════════════════════════════════
          # AUS (bestaetigt kaputt): wots2-persistent-buffers.py
          #   glMapBufferRange auf Mali-G31 liefert undefinierte
          #   Vertex-Daten. Ursache des schwarzen/weissen Bildes.
          # ════════════════════════════════════════════════════════════
          echo "  (wots2-persistent-buffers.py — AUS, Ursache des schwarzen Bildes)"

          # ── Kollision ───────────────────────────────────────────────
          S=$(find_script wots2-collision-neon.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/game/collision_world.cpp; }

          S=$(find_script wots2-collision-relative-neon.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/game/collision_world.cpp; } \
                    || echo "  (wots2-collision-relative-neon.py nicht gefunden)"

          # ── Caches ──────────────────────────────────────────────────
          S=$(find_script wots2-chara-resources-cache.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/game/chara_resources.cpp; } \
                    || echo "  (wots2-chara-resources-cache.py nicht gefunden)"

          S=$(find_script wots2-chara-mgr-find-cache.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/game/chara_mgr.cpp; } \
                    || echo "  (wots2-chara-mgr-find-cache.py nicht gefunden)"

          S=$(find_script wots2-chara-body-last-array.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/game/chara_body.cpp; } \
                    || echo "  (wots2-chara-body-last-array.py nicht gefunden)"

          S=$(find_script wots2-map-collision-cell-cache.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/game/map_collision.cpp; } \
                    || echo "  (wots2-map-collision-cell-cache.py nicht gefunden)"

          # ── NPC-LOD (wots2-npc-lod-closer.py) ───────────────────────
          S=$(find_script wots2-npc-lod-closer.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/game/chara.cpp; } \
                    || echo "  (wots2-npc-lod-closer.py nicht gefunden)"

          # ── NPC-Max-Dist (wots2-npc-max-dist.py, optional) ──────────
          S=$(find_script wots2-npc-max-dist.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/game/chara.cpp; } \
                    || echo "  (wots2-npc-max-dist.py nicht gefunden)"

          # ── FX-Scale ────────────────────────────────────────────────
          S=$(find_script wots2-fx-scale.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/game/world_effects.cpp; } \
                    || echo "  (wots2-fx-scale.py nicht gefunden)"

          # ── motion.cpp NEON ─────────────────────────────────────────
          S=$(find_script wots2-motion-neon.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/engine/motion.cpp; } \
                    || echo "  (wots2-motion-neon.py nicht gefunden)"

          # ── pad.cpp: A<->B, X<->Y (M9 Pro / R36S) ───────────────────
          S=$(find_script wots2-pad-swap.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" src/hal/pad.cpp; } \
                    || echo "  (wots2-pad-swap.py nicht gefunden — uebersprungen)"

          # ── port_options.h Defaults ─────────────────────────────────
          S=$(find_script patch_config_defaults.py)
          [ -n "$S" ] && { echo "== $S =="; python3 "$S" .; } \
                    || echo "  (patch_config_defaults.py nicht gefunden)"

          echo "== Patches fertig =="

      - name: CMake konfigurieren
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/aarch64-arkos.cmake" \
            -DSDL2_INSTALL_DIR="$SDL2_INSTALL" \
            -DWOTS2_GLES=ON \
            -DSDL2_DIR="$SDL2_INSTALL/lib/cmake/SDL2" \
            -DCMAKE_PREFIX_PATH="$SDL2_INSTALL;$SYSROOT_LIB" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_SHARED_LIBS=OFF

      - name: Bauen
        run: cmake --build build -j "$JOBS"

      - name: Binary-Abhängigkeiten protokollieren
        run: |
          set -euo pipefail
          aarch64-linux-gnu-readelf -d build/wots2 | grep -E 'NEEDED|SONAME' || true
          aarch64-linux-gnu-readelf -l build/wots2 | grep -i interpreter || true
          ls -la build/wots2
          file build/wots2

      - name: Bundle vorbereiten
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/dist"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/wots2/libs.aarch64" "$STAGE/wots2/extracted" "$STAGE/wots2/shader_cache"

          install -m 755 build/wots2 "$STAGE/wots2/wots2"
          [ -f port.ini ] && install -m 644 port.ini "$STAGE/wots2/port.ini" || true
          [ -f WOTS2.sh ] && install -m 755 WOTS2.sh "$STAGE/WOTS2.sh" || true
          [ -f sdl_mapping.py ] && install -m 755 sdl_mapping.py "$STAGE/wots2/sdl_mapping.py" || true
          [ -f README.md ] && install -m 644 README.md "$STAGE/README.md" || true

          CHD_DIR="$GITHUB_WORKSPACE/chdman-arm64"
          [ -f "$CHD_DIR/chdman" ] && install -m 755 "$CHD_DIR/chdman" "$STAGE/wots2/chdman"
          [ -f "$CHD_DIR/LICENSE-chdman.txt" ] && install -m 644 "$CHD_DIR/LICENSE-chdman.txt" "$STAGE/wots2/LICENSE-chdman.txt"

          for lib in build/libs.aarch64/*.so*; do
            [ -e "$lib" ] && cp -a "$lib" "$STAGE/wots2/libs.aarch64/" || true
          done

          if [ -d "$SDL2_INSTALL/lib" ]; then
            for f in "$SDL2_INSTALL/lib"/libSDL2-2.0.so*; do
              [ -e "$f" ] || continue
              cp -a "$f" "$STAGE/wots2/libs.aarch64/"
            done
          fi

          find "$STAGE" -type d -exec chmod 755 {} \;
          find "$STAGE" -type f -exec chmod 644 {} \;
          chmod 755 "$STAGE/WOTS2.sh" "$STAGE/wots2/wots2"
          [ -f "$STAGE/wots2/sdl_mapping.py" ] && chmod 755 "$STAGE/wots2/sdl_mapping.py" || true
          [ -f "$STAGE/wots2/chdman" ] && chmod 755 "$STAGE/wots2/chdman" || true

          touch "$STAGE/wots2/extracted/.gitkeep" "$STAGE/wots2/shader_cache/.gitkeep"
          find "$STAGE" -maxdepth 3 -printf '  %M %8s  %p\n'

      - name: Tarball erzeugen
        run: |
          set -euo pipefail
          cd dist
          tar -czf wots2-rk3326.tar.gz wots2 WOTS2.sh README.md 2>/dev/null || \
            tar -czf wots2-rk3326.tar.gz wots2 WOTS2.sh
          echo "== tar =="
          tar -tzf wots2-rk3326.tar.gz | head -40
          ls -la

      - name: Upload Artefakt (Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: wots2-rk3326
          path: dist/wots2-rk3326.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Fehleranalyse
        if: always()
        run: bash scripts/ci-error-report.sh || true

      - name: Upload Fehleranalyse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-analysis
          path: build-error-analysis.txt
          if-no-files-found: warn
          retention-days: 30
