name: craft WOTS2 for RK3326

on:
  workflow_dispatch:
    inputs:
      strict_patches:
        description: 'Build abbrechen, wenn ein Patch nichts aendert oder sein Muster nicht findet'
        type: boolean
        default: false
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'README.md'

permissions:
  contents: write

jobs:
  build:
    name: Build host (aarch64) for M9 Pro / RK3326
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    env:
      SYSROOT_LIB: ${{ github.workspace }}/sysroot
      SDL2_INSTALL: ${{ github.workspace }}/sdl2-install
      DEBIAN_FRONTEND: noninteractive
      PKG_CONFIG_PATH: ${{ github.workspace }}/sysroot/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig
      JOBS: "4"
      CHDMAN_VERSION: "0.288.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Repo-Struktur prüfen
        run: |
          echo "== Root =="; ls -la
          echo "== patches/ =="; ls -la patches/ || true
          echo "== scripts/ =="; ls -la scripts/ || true
          echo "== cmake/ =="; ls -la cmake/ || true

      - name: aarch64 Multiarch aktivieren
        run: |
          dpkg --add-architecture arm64
          cp /etc/apt/sources.list /etc/apt/sources.list.bak
          sed -i -E 's/^deb (\[[^]]*\] )?http/deb [arch=amd64] http/' /etc/apt/sources.list
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main universe' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main universe' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main universe' \
            > /etc/apt/sources.list.d/arm64.list
          apt-get update

      - name: CMake 3.28.3 installieren
        run: |
          apt-get install -y --no-install-recommends wget ca-certificates
          wget -q https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz
          tar -xzf cmake-3.28.3-linux-x86_64.tar.gz -C /opt
          ln -sf /opt/cmake-3.28.3-linux-x86_64/bin/cmake  /usr/local/bin/cmake
          ln -sf /opt/cmake-3.28.3-linux-x86_64/bin/ctest  /usr/local/bin/ctest
          ln -sf /opt/cmake-3.28.3-linux-x86_64/bin/cpack  /usr/local/bin/cpack
          rm cmake-3.28.3-linux-x86_64.tar.gz
          cmake --version

      - name: Native Build-Tools installieren
        run: |
          apt-get install -y --no-install-recommends \
            build-essential ninja-build git curl wget ca-certificates \
            pkg-config python3 python3-pip file patchelf \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            unzip p7zip-full libarchive-tools zstd xz-utils

      - name: aarch64 Dev-Pakete installieren
        run: |
          apt-get install -y --no-install-recommends \
            libdrm-dev:arm64 libgbm-dev:arm64 libegl-dev:arm64 \
            libgles2-mesa-dev:arm64 libasound2-dev:arm64 libudev-dev:arm64 \
            libarchive-dev:arm64 zlib1g-dev:arm64 libbz2-dev:arm64 \
            liblzma-dev:arm64 libzstd-dev:arm64 liblz4-dev:arm64 \
            libwayland-dev:arm64 libpulse-dev:arm64 libxkbcommon-dev:arm64

      - name: Cross-Sysroot einrichten
        run: bash scripts/ci-setup-sysroot.sh

      - name: SDL2 mit KMSDRM-Patches und ALSA bauen
        run: bash scripts/ci-build-sdl2.sh

      - name: Stubs (libmali, libdecor)
        run: bash scripts/ci-build-stubs.sh

      - name: CHD-Extractor (chdman arm64) herunterladen
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/chdman-arm64"
          cd "$GITHUB_WORKSPACE/chdman-arm64"
          wget -q -O chdman \
            "https://unpkg.com/@emmercm/chdman-linux-arm64@${CHDMAN_VERSION}/dist/chdman"
          wget -q -O LICENSE-chdman.txt \
            "https://unpkg.com/@emmercm/chdman-linux-arm64@${CHDMAN_VERSION}/LICENSE"
          chmod 755 chdman
          file chdman

      # ═══════════════════════════════════════════════════════════════
      # REPARATUR: Patch-Skripte ohne __main__-Guard
      # ═══════════════════════════════════════════════════════════════
      # Mehrere Patch-Skripte definieren main(), rufen es aber nie auf.
      # Der Build-Log zeigte dafuer bisher 12 PATCH-WARNUNG-Zeilen
      # ("das Skript tut nichts" + "hat NICHTS veraendert"), und die
      # betroffenen Patches waren im Binary effektiv nicht vorhanden.
      #
      # Dieser Step haengt die fehlende `if __name__ == "__main__": main()`
      # Zeile an, ist idempotent (bereits reparierte Skripte werden
      # uebersprungen) und bricht den Build mit ::error:: ab, wenn danach
      # noch ein Skript ohne Guard dasteht.
      #
      # Es wird NICHTS committet: die Reparatur gilt nur fuer diesen
      # Build-Run. Zum Persistieren im Repo entweder
      # .github/workflows/repair-wots2-main.yml manuell triggern, oder
      # fix-patches.yml, falls die Datei so heisst.
      #
      # Betroffene Skripte im letzten Build:
      #   wots2-fast-fades.py, wots2-neon-skinning.py,
      #   wots2-neon-matrix.py, wots2-neon-vecmath.py,
      #   wots2-neon-particles.py, wots2-reduce-shadow.py
      # ═══════════════════════════════════════════════════════════════
      - name: Patches reparieren (main()-Einstiegspunkte)
        shell: bash
        run: |
          set -uo pipefail

          REPAIRED=0
          SKIPPED_ALREADY=0
          SKIPPED_NO_MAIN=0

          # Der apply()-Step spaeter sucht sowohl in patches/ als auch im
          # Repo-Root (find_script). Also decken wir hier beide Orte ab,
          # sonst bliebe z.B. wots2-app-timing.py im Root unrepariert.
          for f in patches/wots2-*.py wots2-*.py; do
            [ -f "$f" ] || continue

            if ! grep -qE '^def main\(' "$f"; then
              SKIPPED_NO_MAIN=$((SKIPPED_NO_MAIN + 1))
              continue
            fi

            if grep -qE '__main__|^main\(\)' "$f"; then
              SKIPPED_ALREADY=$((SKIPPED_ALREADY + 1))
              continue
            fi

            printf '\n\nif __name__ == "__main__":\n    main()\n' >> "$f"
            echo "  repariert: $f"
            REPAIRED=$((REPAIRED + 1))
          done

          echo ""
          echo "Reparatur-Zusammenfassung:"
          echo "  repariert:         $REPAIRED"
          echo "  schon vorhanden:   $SKIPPED_ALREADY"
          echo "  ohne def main():   $SKIPPED_NO_MAIN"

          # Verifikation: nach der Reparatur darf kein Skript mehr
          # main() definieren, ohne es aufzurufen.
          BAD=""
          for f in patches/wots2-*.py wots2-*.py; do
            [ -f "$f" ] || continue
            if grep -qE '^def main\(' "$f" && ! grep -qE '__main__|^main\(\)' "$f"; then
              BAD="$BAD $f"
            fi
          done

          if [ -n "$BAD" ]; then
            echo "::error title=Patch-Reparatur fehlgeschlagen::Diese Skripte definieren main(), rufen es aber weiterhin nicht auf:$BAD"
            exit 1
          fi

          if [ "$REPAIRED" -gt 0 ]; then
            echo "::notice title=Patches repariert::$REPAIRED Skript(e) um __main__-Guard ergaenzt."
          fi

      - name: Patches anwenden
        env:
          WOTS2_PATCH_STRICT: ${{ (github.event_name == 'workflow_dispatch' && inputs.strict_patches) && '1' || '0' }}
        run: |
          set -euo pipefail

          find_script() {
            local name="$1"
            if [ -f "patches/$name" ]; then echo "patches/$name"
            elif [ -f "$name" ];      then echo "$name"
            else echo ""; fi
          }

          : > patch.log

          # Hash ueber alle Quelldateien: zeigt, ob ein Patch wirklich etwas aendert.
          # (Im Container gibt es beim Checkout kein .git, 'git diff' geht nicht.)
          tree_hash() {
            find . -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.c' \
                              -o -name '*.cmake' -o -name '*.ini' \) \
              -not -path './.git/*' -not -path './build/*' -not -path './sysroot/*' \
              -not -path './sdl2-install/*' -not -path './chdman-arm64/*' \
              -not -path './dist/*' -not -path './patched-sources/*' \
              -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16
          }

          # apply <skript> <ziel>: fuehrt ein Patch-Skript aus und meldet laut,
          # wenn es fehlt oder nichts veraendert hat.
          apply() {
            local name="$1" target="$2" S h1 h2 rc
            S=$(find_script "$name")
            if [ -z "$S" ]; then
              echo "PATCH-WARNUNG: $name FEHLT (weder in patches/ noch im Repo-Root)" | tee -a patch.log
              return 0
            fi
            echo "== $S =="        | tee -a patch.log
            echo "   Skript: $(wc -c < "$S") Bytes, $(wc -l < "$S") Zeilen" | tee -a patch.log
            if [ ! -e "$target" ]; then
              echo "PATCH-WARNUNG: $name: Ziel '$target' existiert nicht" | tee -a patch.log
            fi
            # Haeufigster stiller Fehler: main() definiert, aber nie aufgerufen.
            # Der "Patches reparieren"-Step oben sollte das bereits behoben
            # haben. Bleibt die Warnung hier, ist die Reparatur gescheitert.
            if grep -qE '^def main\(' "$S" && ! grep -qE '__main__|^main\(\)' "$S"; then
              echo "PATCH-WARNUNG: $name definiert main(), ruft es aber nie auf - das Skript tut nichts" | tee -a patch.log
            fi
            h1=$(tree_hash)
            rc=0
            python3 -u "$S" "$target" 2>&1 | tee -a patch.log || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "PATCH-FEHLER: $name endete mit Exit-Code $rc" | tee -a patch.log
            fi
            h2=$(tree_hash)
            if [ "$h1" = "$h2" ]; then
              echo "PATCH-WARNUNG: $name hat NICHTS veraendert" | tee -a patch.log
            fi
          }

          # ══ KRITISCHE ENGINE-PATCHES (MÜSSEN ZUERST LAUFEN) ══════════
          apply wots2-app-deltatime.py src/engine/app.cpp

          apply wots2-sdl2-doublebuffer.py src/hal/gs.cpp

          # ══ BESTEHENDE PATCHES ═════════════════════════════════════
          apply wots2-gles.py src/hal/gs.cpp

          apply wots2-gles-precision.py src/hal/gs.cpp

          apply wots2-neon.py src/hal/gs.cpp

          apply wots2-gs-tex-storage.py src/hal/gs.cpp

          apply wots2-gs-invalidate.py src/hal/gs.cpp

          apply wots2-gs-shader-cache.py src/hal/gs.cpp

          apply wots2-gs-batch-2d.py src/hal/gs.cpp

          apply wots2-gs-splash.py src/hal/gs.cpp

          apply wots2-gs-init-diag.py src/hal/gs.cpp

          apply wots2-gs-combat.py src/hal/gs.cpp

          apply wots2-collision-neon.py src/game/collision_world.cpp

          apply wots2-collision-relative-neon.py src/game/collision_world.cpp

          apply wots2-chara-resources-cache.py src/game/chara_resources.cpp

          apply wots2-chara-mgr-find-cache.py src/game/chara_mgr.cpp

          apply wots2-chara-body-last-array.py src/game/chara_body.cpp

          apply wots2-map-collision-cell-cache.py src/game/map_collision.cpp

          apply wots2-fx-scale.py src/game/world_effects.cpp

          apply wots2-motion-neon.py src/engine/motion.cpp

          apply wots2-pad-swap.py src/hal/pad.cpp

          apply patch_config_defaults.py .

          # ══ SICHERE ZUSATZ-PATCHES ══════════════════════════════════
          apply wots2-gs-perf-trace-v3.py src/hal/gs.cpp

          apply wots2-gs-state-dedup.py src/hal/gs.cpp

          apply wots2-gs-no-bump.py src/hal/gs.cpp

          apply wots2-gs-lights-cap.py src/hal/gs.cpp

          apply wots2-gs-bloom-env.py src/hal/gs.cpp

          apply wots2-gs-no-post-env.py src/hal/gs.cpp

          apply wots2-npc-lod-closer.py src/game/chara.cpp

          apply wots2-npc-max-dist.py src/game/chara.cpp

          apply wots2-hle-neon-matmul.py src/native/hle.cpp

          apply wots2-chara-draw-lod.py src/native/hle_chara.cpp

          apply wots2-chara-pose-pool.py src/native/hle_chara.cpp

          apply wots2-map-batching.py .

          apply wots2-npc-sim-distance.py .

          apply wots2-frame-timing.py .

          apply wots2-gs-frame-timing.py .

          apply wots2-app-timing.py src/engine/app.cpp

          # ══ NEUE PERFORMANCE-PATCHES ═══════════════════════════════
          apply wots2-gs-novsync.py src/hal/gs.cpp

          apply wots2-sword-draw-dist.py src/game/chara.cpp

          apply wots2-skeleton-swing-skip.py src/game/chara.cpp

          apply wots2-hud-fast-text.py src/game/hud.cpp

          apply wots2-collision-cache.py src/native/hle_tasks.cpp

          # DEAKTIVIERT (wirkt nur waehrend Ueberblendungen, 8 statt 80 Streifen erzeugen sichtbares Banding):

          # apply wots2-fast-fades.py src/native/hle.cpp

          # DEAKTIVIERT (spart nur Skeleton_UpdateWorld/Swing verdeckter Figuren, unter ca. 0,3 ms;
          # Bone-Matrizen werden schon im Update-Schritt berechnet, Haar-/Stoff-Zustand friert ein):
          # apply wots2-chara-draw-cull.py src/game/chara.cpp

          apply wots2-no-sword-shadow.py src/game/chara.cpp

          apply wots2-neon-skinning.py src/native/model.cpp

          # DEAKTIVIERT (FALSCH: rechnet bei allen Testmatrizen anders als das Original (Zeilen/Spalten vertauscht) und ist ueberfluessig, mat_mul ist schon NEON):

          # apply wots2-neon-matrix.py src/native/hle.cpp

          # DEAKTIVIERT (Nutzen minimal, andere Summationsreihenfolge, falsch falls Dot() nur xyz summiert (camera.cpp ungeprueft)):

          # apply wots2-neon-vecmath.py src/game/camera.cpp

          # DEAKTIVIERT (Nutzen minimal (FX_SCALE 0.05), schreibt 4 Floats in pos/vel (Layout ungeprueft), skaliert auch die w-Lane):

          # apply wots2-neon-particles.py src/game/world_effects.cpp

          # DEAKTIVIERT (redundant zu wots2-gles-precision.py, Anker passt nicht zum umgestellten Shader):
          # apply wots2-gs-mediump.py src/hal/gs.cpp

          apply wots2-gs-no-mipmap.py src/hal/gs.cpp

          # DEAKTIVIERT (Anker passt nicht mehr zu map-batching v3:
          # zwei glBufferData-Treffer im Mesh-Fall statt einem.
          # Auf Mali-G31 ist der Ring-Puffer ohnehin dokumentiert riskant -
          # siehe wots2-gs-orphan-vbo.py: 0,4 FPS; wots2-persistent-buffers.py:
          # schwarz/weiss durch glMapBufferRange. Nicht wieder aktivieren,
          # ohne die Mali-Ring-Frage zu klaeren):
          # apply wots2-gs-fast-vbo.py src/hal/gs.cpp

          # --- Hardware-Optimierungen und Figuren-Ausblendung (Mali-G31) ---

          apply wots2-gs-lazy-blit.py src/hal/gs.cpp

          # lazy-state MUSS vor backface-cull laufen (prueft state_3d/state_2d streng)

          apply wots2-gs-lazy-state.py src/hal/gs.cpp

          apply wots2-gs-npc-fade.py src/hal/gs.cpp

          apply wots2-gs-backface-cull.py src/hal/gs.cpp

          apply wots2-gs-tex-cache.py src/hal/gs.cpp

          apply wots2-reduce-shadow.py src/native/hle_chara.cpp

          apply wots2-chara-fade-flag.py src/native/hle_chara.cpp

          echo "== Patches fertig ==" | tee -a patch.log

          # ── Zusammenfassung: alles, was nicht sauber lief, als Annotation ──
          TOTAL=$(grep -cE 'PATCH-FEHLER:|PATCH-WARNUNG:' patch.log || true)
          grep -E 'PATCH-FEHLER:|PATCH-WARNUNG:' patch.log | while IFS= read -r l; do
            echo "::warning title=Patch-Problem::$l"
          done || true
          echo "Patch-Probleme gesamt: $TOTAL"
          if [ "$TOTAL" -gt 0 ] && [ "${WOTS2_PATCH_STRICT:-0}" = "1" ]; then
            echo "::error::Strict-Modus: $TOTAL Patch-Problem(e), siehe patch.log"
            exit 1
          fi

      - name: Patch-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-log
          path: patch.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Launcher-Variablen gegen Code pruefen
        run: |
          set -uo pipefail
          [ -f WOTS2.sh ] || { echo "WOTS2.sh nicht gefunden - uebersprungen"; exit 0; }
          MISSING=""
          for v in $(grep -ohE 'WOTS2_[A-Z0-9_]+' WOTS2.sh | sort -u); do
            if ! grep -rqs --include='*.cpp' --include='*.h' --include='*.hpp' --include='*.c' \
                 "$v" src include mods 2>/dev/null; then
              MISSING="$MISSING $v"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "Launcher-Variablen ohne Treffer im C++-Code (nur fuers Shell-Skript gedacht, oder wirkungslos):"
            for v in $MISSING; do echo "  $v"; done
            echo "::notice title=Launcher-Variablen ohne Treffer im C++-Code::$MISSING"
          else
            echo "Alle WOTS2_*-Variablen des Launchers kommen im C++-Code vor."
          fi

      - name: Gepatchte Quelldateien sichern
        if: always()
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/patched-sources"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          FILES=(
            "src/hal/gs.cpp"
            "src/hal/pad.cpp"
            "src/game/collision_world.cpp"
            "src/game/chara_resources.cpp"
            "src/game/chara_mgr.cpp"
            "src/game/chara_body.cpp"
            "src/game/chara.cpp"
            "src/game/map_collision.cpp"
            "src/game/world_effects.cpp"
            "src/game/hud.cpp"
            "src/game/camera.cpp"
            "src/engine/motion.cpp"
            "src/engine/app.cpp"
            "src/native/hle.cpp"
            "src/native/hle_chara.cpp"
            "src/native/hle_tasks.cpp"
            "src/native/model.cpp"
            "include/native/model.h"
            "include/hal/gs.h"
          )

          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then
              mkdir -p "$OUT/$(dirname "$f")"
              cp -a "$f" "$OUT/$f"
            fi
          done

      - name: Upload gepatchte Quellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-sources
          path: patched-sources/
          retention-days: 14

      - name: CMake konfigurieren
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/aarch64-arkos.cmake" \
            -DSDL2_INSTALL_DIR="$SDL2_INSTALL" \
            -DWOTS2_GLES=ON \
            -DSDL2_DIR="$SDL2_INSTALL/lib/cmake/SDL2" \
            -DCMAKE_PREFIX_PATH="$SDL2_INSTALL;$SYSROOT_LIB" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_SHARED_LIBS=OFF

      - name: Bauen
        run: cmake --build build -j "$JOBS"

      - name: Kompatibilitaet pruefen (glibc, Bibliotheken)
        env:
          MAX_GLIBC: "2.30"      # ArkOS4Clone meldet CFW_GLIBC=230
        run: |
          set -euo pipefail

          echo "== NEEDED =="
          aarch64-linux-gnu-readelf -d build/wots2 | grep NEEDED || true
          if aarch64-linux-gnu-readelf -d build/wots2 | grep -q 'libgomp'; then
            echo "::notice title=OpenMP::Binary braucht libgomp.so.1 auf dem Geraet (nicht im Bundle)."
          fi

          maxver() {   # maxver GLIBC | GLIBCXX | CXXABI
            aarch64-linux-gnu-objdump -T build/wots2 \
              | { grep -oE "$1_[0-9][0-9.]*" || true; } \
              | sed "s/^$1_//" | sort -Vu | tail -1
          }
          G=$(maxver GLIBC);  X=$(maxver GLIBCXX);  C=$(maxver CXXABI)
          echo "Hoechste benoetigte Versionen: GLIBC=${G:-keine} GLIBCXX=${X:-keine} CXXABI=${C:-keine}"
          echo "::notice title=Symbolversionen::GLIBC ${G:-keine}, GLIBCXX ${X:-keine}, CXXABI ${C:-keine}"

          if [ -n "$G" ] && [ "$(printf '%s\n%s\n' "$MAX_GLIBC" "$G" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error title=glibc zu neu::Binary braucht GLIBC_$G, das Geraet hat nur $MAX_GLIBC"
            exit 1
          fi

      - name: Bundle vorbereiten
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/dist"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/wots2/libs.aarch64" "$STAGE/wots2/extracted" "$STAGE/wots2/shader_cache"

          install -m 755 build/wots2 "$STAGE/wots2/wots2"
          [ -f port.ini ] && install -m 644 port.ini "$STAGE/wots2/port.ini" || true
          [ -f WOTS2.sh ] && install -m 755 WOTS2.sh "$STAGE/WOTS2.sh" || true
          [ -f sdl_mapping.py ] && install -m 755 sdl_mapping.py "$STAGE/wots2/sdl_mapping.py" || true
          [ -f README.md ] && install -m 644 README.md "$STAGE/README.md" || true

          CHD_DIR="$GITHUB_WORKSPACE/chdman-arm64"
          [ -f "$CHD_DIR/chdman" ] && install -m 755 "$CHD_DIR/chdman" "$STAGE/wots2/chdman"
          [ -f "$CHD_DIR/LICENSE-chdman.txt" ] && install -m 644 "$CHD_DIR/LICENSE-chdman.txt" "$STAGE/wots2/LICENSE-chdman.txt"

          for lib in build/libs.aarch64/*.so*; do
            [ -e "$lib" ] && cp -a "$lib" "$STAGE/wots2/libs.aarch64/" || true
          done

          if [ -d "$SDL2_INSTALL/lib" ]; then
            for f in "$SDL2_INSTALL/lib"/libSDL2-2.0.so*; do
              [ -e "$f" ] || continue
              cp -a "$f" "$STAGE/wots2/libs.aarch64/"
            done
          fi

          find "$STAGE" -type d -exec chmod 755 {} \;
          find "$STAGE" -type f -exec chmod 644 {} \;
          chmod 755 "$STAGE/WOTS2.sh" "$STAGE/wots2/wots2"
          [ -f "$STAGE/wots2/sdl_mapping.py" ] && chmod 755 "$STAGE/wots2/sdl_mapping.py" || true
          [ -f "$STAGE/wots2/chdman" ] && chmod 755 "$STAGE/wots2/chdman" || true

          touch "$STAGE/wots2/extracted/.gitkeep" "$STAGE/wots2/shader_cache/.gitkeep"

      - name: Tarball erzeugen
        run: |
          set -euo pipefail
          cd dist
          tar -czf wots2-rk3326.tar.gz wots2 WOTS2.sh README.md 2>/dev/null || \
            tar -czf wots2-rk3326.tar.gz wots2 WOTS2.sh
          ls -la

      - name: Upload Artefakt (Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: wots2-rk3326
          path: dist/wots2-rk3326.tar.gz
          retention-days: 30
          if-no-files-found: error
